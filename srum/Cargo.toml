[package]
name = "sootmark-srum"
version = "0.2.0"
# Yamato Security's fork of the upstream crate (https://github.com/Sootmark/srum): not published
# under the upstream name.
publish = false
edition = "2021"
rust-version = "1.80"
description = "Windows System Resource Usage Monitor (SRUM, SRUDB.dat) for forensics: every provider table (network and application usage, connectivity, energy, the application timeline, Windows Server's tables) per program and user, decoded as SrumECmd does, read with sootmark-ese."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Yamato-Security/ys-srum-parser"
homepage = "https://github.com/Yamato-Security/ys-srum-parser"
keywords = ["forensics", "dfir", "incident-response", "srum", "windows"]
# Sources only: test fixtures stay in the repository.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[lib]
name = "srum"

[dependencies]
ese = { package = "sootmark-ese", path = "../ese", version = "0.2" }

[dev-dependencies]
# gzip, for the test databases stored compressed.
common = { package = "sootmark-common", version = "0.3.7" }
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
